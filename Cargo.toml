[package]
name = "tinsel"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Clean, pink-hued terminal output with a little sparkle: live step lists, spinners, tables, trees, prompts and more. Zero dependencies."
authors = ["borhara"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/borhara/tinsel"
documentation = "https://docs.rs/tinsel"
keywords = ["cli", "terminal", "spinner", "progress", "prompt"]
categories = ["command-line-interface"]
exclude = ["/.github", "/docs", "/scripts", "demo.tape", "demo.gif", "release-plz.toml"]

[dependencies]
