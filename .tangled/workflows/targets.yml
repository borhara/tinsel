# that the Windows, macOS and wasm code builds and passes clippy, and the web page's side still
# fits the wasm it runs, though nothing here can run the rest
when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - rustup
  - gcc
  # for the web page's side, src/web.js, tested against the wasm it runs
  - nodejs

environment:
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"

steps:
  - name: clippy
    command: |
      rustup toolchain install stable --profile minimal --component clippy \
        --target x86_64-pc-windows-msvc --target aarch64-apple-darwin --target wasm32-wasip1
      rustup default stable
      cargo clippy --all-targets --target x86_64-pc-windows-msvc
      cargo clippy --all-targets --target aarch64-apple-darwin
  - name: wasm
    command: |
      # the web feature's apps, and the docs page at tinsel.shiv.mov built as one
      cargo clippy --lib --features web --target wasm32-wasip1
      cargo build --example web_docs --features web --target wasm32-wasip1
      node --test tests/web.mjs
  - name: reference
    command: |
      # the Reference tab in tinsel docs, written from rustdoc's JSON, still as the code is
      rustup toolchain install nightly-2026-11-25 --profile minimal
      node scripts/reference.mjs --check
