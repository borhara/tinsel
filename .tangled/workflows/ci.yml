# fmt, clippy, the tests and the docs, on the latest stable Rust, as you'd have
when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

# rustup rather than nixpkgs' Rust, whose clippy runs ahead of stable's
dependencies:
  - rustup
  - gcc

environment:
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

steps:
  - name: toolchain
    command: |
      rustup toolchain install stable --profile minimal --component rustfmt,clippy
      rustup default stable
  - name: fmt
    command: cargo fmt --check
  - name: clippy
    command: cargo clippy --all-targets
  - name: clippy with the image decoder
    command: cargo clippy --all-targets --features decode
  - name: test
    command: cargo test --all-targets
  - name: test with the image decoder
    command: cargo test --all-targets --features decode
  - name: doctest
    command: cargo test --doc
  - name: docs
    command: cargo doc --no-deps --all-features
